name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Decode Release Keystore
        run: |
          # Create target directories if they don't exist
          mkdir -p app android/app

          # Decode Base64 string while stripping all newlines, carriage returns, and spaces
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > release-key.jks

          # Copy to expected build locations
          cp release-key.jks app/release-key.jks 2>/dev/null || true
          cp release-key.jks android/app/release-key.jks 2>/dev/null || true

      - name: Verify Keystore File
        run: |
          if [ ! -s release-key.jks ]; then
            echo "::error::Keystore Base64 secret is missing or empty. Please check RELEASE_KEYSTORE_BASE64 in GitHub Repository Secrets."
            exit 1
          fi
          echo "Keystore successfully decoded ($(stat -c%s release-key.jks) bytes)."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            cd android && ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify APK Signature and Non-Debug Status
        run: |
          # 1. Locate the generated release APK
          RELEASE_APK=$(find . -path "*/build/outputs/apk/release/*-release.apk" -o -path "*/build/outputs/apk/release/*-unsigned.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Could not find generated release APK under build/outputs/apk/release/"
            exit 1
          fi
          echo "Found release APK at: $RELEASE_APK"

          # 2. Locate apksigner in Android SDK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner at: $APKSIGNER"

          # 3. Print certificate info and check signature
          echo "=== Verifying APK Signature Scheme & Certificate ==="
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs --verbose "$RELEASE_APK")
          echo "$CERT_OUTPUT"

          # 4. CRITICAL CHECK: Reject any build signed with Android Debug Key
          if echo "$CERT_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::CRITICAL FAILURE: The APK was signed with the Android Debug Certificate (CN=Android Debug)!"
            echo "::error::Indus App Store and Google Play will reject this APK. Failing workflow."
            exit 1
          fi

          echo "SUCCESS: The APK is verified as signed with a production release certificate."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Secure Cleanup
        if: always()
        run: |
          rm -f release-key.jks app/release-key.jks android/app/release-key.jks
