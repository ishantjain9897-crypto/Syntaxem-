name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Decode Release Keystore
        env:
          RAW_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Checking secret availability..."
          SECRET_LEN=${#RAW_BASE64}
          echo "Secret character length: $SECRET_LEN"
          
          if [ "$SECRET_LEN" -lt 50 ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is empty or too short ($SECRET_LEN chars). Please check your Repository Secrets in GitHub Settings."
            exit 1
          fi

          echo "Decoding release keystore..."
          printf "%s" "$RAW_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/release.jks"

          KEYSTORE_SIZE=$(stat -c%s "${{ runner.temp }}/release.jks" 2>/dev/null || echo 0)
          echo "Decoded keystore size: $KEYSTORE_SIZE bytes"

          if [ "$KEYSTORE_SIZE" -le 0 ]; then
            echo "::error::Decoded keystore file is 0 bytes. The Base64 string is corrupted or invalid."
            exit 1
          fi

      - name: Verify Keystore Integrity with Keytool
        env:
          KEY_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          echo "Verifying keystore with keytool..."
          if [ -n "$KEY_PASS" ]; then
            keytool -list -keystore "${{ runner.temp }}/release.jks" -storepass "$KEY_PASS" || {
              echo "::warning::Keytool verification failed with provided password. Continuing to Gradle build to test..."
            }
          else
            echo "::warning::RELEASE_KEYSTORE_PASSWORD is not set. Gradle build may fail if password is required."
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean :app:assembleRelease --stacktrace --no-daemon
          else
            echo "gradlew not found in repository root; using setup-gradle CLI directly..."
            gradle clean :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify APK Signature and Non-Debuggable Status
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated at $RELEASE_APK"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          echo "=== 1. Verifying APK Signature (V1/V2 schemes) ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_APK"

          echo "=== 2. Confirming APK is NOT Debuggable ==="
          if "$BUILD_TOOLS_DIR/aapt2" dump badging "$RELEASE_APK" | grep -iE "application-debuggable|android:debuggable"; then
            echo "::error::FAILURE: APK contains debug flag! Indus App Store will reject this build."
            exit 1
          fi
          echo "SUCCESS: APK is strictly non-debuggable."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Secure Cleanup
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.jks"
