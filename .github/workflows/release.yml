name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Java Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Decode Release Keystore
        run: |
          echo "Decoding release keystore from GitHub Secret..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > "${{ runner.temp }}/release.jks"
          if [ ! -s "${{ runner.temp }}/release.jks" ]; then
            echo "::error::Release keystore could not be decoded or is empty. Please check the RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore successfully decoded to temporary location ($(stat -c%s "${{ runner.temp }}/release.jks") bytes)."

      - name: Verify Keystore Integrity with Keytool
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          echo "Verifying keystore file validity and credentials with keytool..."
          keytool -list -v \
            -keystore "${{ runner.temp }}/release.jks" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"
          echo "Keystore verified successfully: valid format and matching alias found."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Verify APK Signature and Non-Debuggable Status
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated at $RELEASE_APK"
            exit 1
          fi

          echo "Locating Android SDK build tools..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          echo "=== 1. Verifying APK Signature (V1/V2 schemes) ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          if [ $? -ne 0 ]; then
            echo "::error::APK signature verification failed!"
            exit 1
          fi

          echo "=== 2. Confirming APK is NOT Debuggable (aapt2 inspection) ==="
          if "$BUILD_TOOLS_DIR/aapt2" dump badging "$RELEASE_APK" | grep -iE "application-debuggable|android:debuggable"; then
            echo "::error::FAILURE: APK contains debug flag! Indus App Store will reject this build."
            exit 1
          fi
          echo "SUCCESS: APK is strictly non-debuggable."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Secure Cleanup
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.jks"
