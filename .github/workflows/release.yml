name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Decode Release Keystore
        run: |
          # Ensure target folders exist in both root and android/ structures
          mkdir -p app android/app

          # Strip any hidden newlines, carriage returns, or spaces and decode
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          
          # Mirror to app/release.keystore for standard root Gradle projects
          cp android/app/release.keystore app/release.keystore

      - name: Verify Keystore File
        run: |
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore Base64 secret is missing or empty. Please check RELEASE_KEYSTORE_BASE64 in GitHub Repository Secrets."
            exit 1
          fi
          echo "Keystore successfully decoded ($(stat -c%s android/app/release.keystore) bytes)."

      - name: Verify Keystore Integrity with Keytool
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "Verifying keystore with keytool..."
          keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"
          echo "Keystore verified successfully."

      - name: Build Release APK
        env:
          # These must match the System.getenv() calls in your build.gradle
          KEYSTORE_FILE: android/app/release.keystore
          RELEASE_KEYSTORE_FILE: android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            cd android && ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Secure Cleanup
        if: always()
        run: |
          rm -f android/app/release.keystore app/release.keystore
